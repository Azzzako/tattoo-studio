name: ci

on:
  pull_request:
    branches: [main, staging, develop]
  push:
    branches: [main, staging, develop]

permissions:
  contents: read

jobs:
  verify:
    name: format · typecheck · lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.42
      - name: Install
        run: bun install --frozen-lockfile
      - name: Format
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Unit & integration
        run: bun run test
      - name: OpenNext build
        run: bun run build
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: example-anon
          SUPABASE_SERVICE_ROLE_KEY: example-service
          TOKEN_ENCRYPTION_KEY: 32-character-encryption-key
          GOOGLE_OAUTH_CLIENT_ID: example
          GOOGLE_OAUTH_CLIENT_SECRET: example
          GOOGLE_OAUTH_REDIRECT_URI: https://example.com/api/google/oauth/callback
          WHATSAPP_PHONE_ID: example
          WHATSAPP_ACCESS_TOKEN: example
          RESEND_API_KEY: example
          RESEND_FROM_EMAIL: no-reply@example.com
          APP_URL: https://example.com
          STUDIO_ID: 00000000-0000-0000-0000-000000000001
          DEFAULT_TZ: America/Mexico_City
          DEFAULT_LOCALE: es-MX
